# ISPConfig Zabbix Monitoring Configuration for Zabbix Agent 2
# This file is installed to /etc/zabbix/zabbix_agent2.d/

### Website Discovery
UserParameter=ispconfig.websites.discovery,/usr/bin/ispconfig-discovery-websites

### Website Metrics
UserParameter=ispconfig.website[*],/usr/bin/ispconfig-key-websites "$1" "$2"

### Email Account Discovery
UserParameter=ispconfig.emails.discovery,/usr/bin/ispconfig-discovery-emails

### Email Account Metrics
UserParameter=ispconfig.email[*],/usr/bin/ispconfig-key-emails "$1" "$2"

### Mail Domain Discovery
UserParameter=ispconfig.maildomains.discovery,/usr/bin/ispconfig-discovery-mail-domains

### Mail Domain Metrics
UserParameter=ispconfig.maildomain[*],/usr/bin/ispconfig-key-mail-domains "$1" "$2"
